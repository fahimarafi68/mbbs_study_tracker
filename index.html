<style>
:root{--bg:#0F172A;--panel:#1E293B;--ink:#F8FAFC;--mute:#94A3B8;--line:#334155;--accent:#A855F7;--grad:linear-gradient(135deg,#6366F1 0%,#A855F7 100%);--pg:#38BDF8;--pgbg:rgba(56,189,248,.14);

.wrap{max-width:850px;margin:0 auto;padding:0 14px 80px}
header.top{padding:30px 0 20px;text-align:center}

.sub{margin:0;color:var(--mute);font-size:14px}

.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.btn.danger{color:#F87171;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.25)}
.btn.danger.arm{background:#EF4444;color:#fff;border-color:#EF4444}
details.sec{margin:20px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.25)}
details.sec[hidden]{display:none}
summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center}
summary::-webkit-details-marker{display:none}
.sn{font-size:20px;font-weight:700;min-width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--grad);color:#fff}
.st{font-weight:600;line-height:1.35}
.sm{display:block;font-weight:400;font-size:12.5px;color:var(--mute)}
.sc{font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.mini{grid-column:1/-1;height:4px;background:var(--bg);border-radius:9px;overflow:hidden}
.mini i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}
details[open] summary{border-bottom:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row:hover{background:rgba(51,65,85,.35)}
.row[hidden]{display:none}
.row input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:22px;height:22px;margin-top:3px;border:2px solid var(--mute);border-radius:7px;display:grid;place-items:center}
.row input:checked+.box{background:var(--grad);border-color:transparent}
.row input:checked+.box::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.main{flex:1;min-width:0}
.q{overflow-wrap:anywhere}
.no{color:var(--mute);margin-right:6px;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:7px}
.pg{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:9px;background:var(--pgbg);border:1px solid rgba(56,189,248,.35);color:var(--pg);font-size:14px;font-weight:700}

.star{padding:2px 8px;border-radius:7px;font-weight:600;font-size:12.5px;letter-spacing:.5px}

.row.done .pg{opacity:.55}
.empty{text-align:center;color:var(--mute);padding:48px 0}

@media (prefers-reduced-motion:reduce){.fill,.mini i{transition:none}}

const KEY='fm_matrix_2026:';
let store={};
try{store=JSON.parse(localStorage.getItem(KEY+'done')||'{}')||{}}catch(e){store={}}
const save=()=>{try{localStorage.setItem(KEY+'done',JSON.stringify(store))}catch(e){}};
const $=s=>document.querySelector(s);
const list=$('#list');
let total=0;
DATA.forEach((sec,si)=>{
  const d=document.createElement('details');d.className='sec';d.open=true;d.id='s'+(si+1);
  d.innerHTML=`<summary><span class="sn">${sec.n}</span><span class="st">${sec.t}<span class="sm">Matrix পৃষ্ঠা ${sec.m}</span></span><span class="sc"></span><span class="mini"><i></i></span></summary>`;
  sec.i.forEach((it,ii)=>{
    total++;
    const id=si+'-'+ii;
    const l=document.createElement('label');l.className='row';
    l.dataset.id=id;l.dataset.star=it[0];
    l.dataset.text=(it[1]+' '+it[2]+' '+it[3]).toLowerCase();
    l.innerHTML=`<input type="checkbox"><span class="box"></span><span class="main"><span class="q">${it[1]?`<span class="no">${it[1]}</span>`:''}</span><span class="meta"><span class="pg"><small>Page</small>${it[3]}</span><span class="star s${it[0]}">${'★'.repeat(it[0])}</span></span></span>`;
    l.querySelector('.q').append(document.createTextNode(it[2]));
    const cb=l.querySelector('input');
    if(store[id]){cb.checked=true;l.classList.add('done')}
    cb.addEventListener('change',()=>{
      l.classList.toggle('done',cb.checked);
      if(cb.checked)store[id]=1;else delete store[id];
      save();update();
    });
    d.append(l);
  });
  list.append(d);
});
let fs=0,fst='all',fq='';
function update(){
  const rows=[...document.querySelectorAll('.row')];
  let done=0,shown=0;
  rows.forEach(r=>{if(r.querySelector('input').checked)done++});
  document.querySelectorAll('details.sec').forEach(sec=>{
    let sd=0,sn=0,sv=0;
    sec.querySelectorAll('.row').forEach(r=>{
      const c=r.querySelector('input').checked;sn++;if(c)sd++;
      const ok=(!fs||+r.dataset.star===fs)&&(fst==='all'||(fst==='done')===c)&&(!fq||r.dataset.text.includes(fq));
      r.hidden=!ok;if(ok)sv++;
    });
    sec.querySelector('.sc').textContent=sd+' / '+sn;
    sec.querySelector('.mini i').style.width=(sn?sd/sn*100:0)+'%';
    sec.hidden=sv===0;shown+=sv;
  });
  const p=total?Math.round(done/total*100):0;
  $('#pct').textContent=p+'%';$('#cnt').textContent=done+' / '+total+' শেষ';$('#fill').style.width=p+'%';
  $('#empty').hidden=shown>0;
}
function chips(id,fn){
  $(id).addEventListener('click',e=>{
    const b=e.target.closest('.chip');if(!b)return;
    $(id).querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));
    fn(b.dataset.v);update();
  });
}
chips('#stars',v=>fs=+v);chips('#stat',v=>fst=v);
$('#q').addEventListener('input',e=>{fq=e.target.value.trim().toLowerCase();update()});
let open=true;
$('#fold').addEventListener('click',e=>{open=!open;document.querySelectorAll('details.sec').forEach(d=>d.open=open);e.target.textContent=open?'সব বন্ধ':'সব খুলুন'});
let arm=0;
$('#reset').addEventListener('click',e=>{
  const b=e.target;
  if(!arm){arm=1;b.textContent='নিশ্চিত? আবার চাপুন';b.classList.add('arm');setTimeout(()=>{arm=0;b.textContent='রিসেট';b.classList.remove('arm')},3500);return}
  arm=0;b.textContent='রিসেট';b.classList.remove('arm');
  store={};save();
  document.querySelectorAll('.row').forEach(r=>{r.querySelector('input').checked=false;r.classList.remove('done')});
  update();
});
update();
</script>
